# ============================================================
# SchematicTools - tools.yml Template & Reference
# ============================================================
# Auto-generated by plugin on first run.
# Manually edit, then use /sbt reload tools to apply without restart.
#
# Field Reference:
#   id          - (int)           Auto-assigned unique ID. Do not duplicate.
#   owner       - (UUID)          Player UUID or "00000000-0000-0000-0000-000000000000" for global.
#   name        - (String)        Unique tool name. Used in /sbt bind, /sbt give, /sbt info.
#   brushName   - (String)        Name of the saved Schematic Brush (from SchematicBrushReborn).
#   permission  - (String)        Custom permission node. null = default "schematictools.use".
#   usages      - (int)           Max usage count. -1 = unlimited.
#   itemSource  - (String)        "VANILLA" or "ITEMS_ADDER". Auto-set at bind time.
#   iaId        - (String)        ItemsAdder namespace:id (e.g. "iasurvival:ruby_sword"). null for vanilla.
#   material    - (String)        Base Material name (e.g. PAPER, MAP, STICK). For fallback when IA is unavailable.
#   displayName - (String)        Custom display name. Supports & codes and &#RRGGBB hex. null = none.
#   lore        - (List|String)   Custom lore lines. Supports & codes and &#RRGGBB hex.
#                                   Multi-line: use YAML list format (see examples below).
#                                   Single line: lore: "one line" (auto-wrapped to list).
#                                   null = no lore (usage counter still added if usages > 0).
#
# Color Codes:
#   &a green    &b aqua    &c red     &d pink    &e yellow   &f white
#   &0 black    &1 navy    &2 green   &3 teal    &4 maroon   &5 purple
#   &6 gold     &7 gray    &8 dark    &9 blue    &l bold     &o italic
#   &n underline &m strike &k obfuscated &r reset
#   Hex: &#FF5555 for #FF5555
#
# ============================================================
# Example Tool Templates
# ============================================================
#
# --- Vanilla item, unlimited uses, with displayName and multi-line lore ---
# tools:
# - id: 0
#   owner: "00000000-0000-0000-0000-000000000000"
#   name: "builder_basic"
#   brushName: "house_small"
#   permission: null
#   usages: -1
#   itemSource: "VANILLA"
#   iaId: null
#   material: "PAPER"
#   displayName: "&6&lBasic Builder"
#   lore:
#     - "&7Left-click to preview"
#     - "&7Right-click to paste"
#     - "&8Unlimited uses"
# currentId: 1
#
# --- Vanilla item, 50 uses, no custom display ---
# tools:
# - id: 1
#   owner: "7272c687-71fb-3ea0-93b9-b37321ea9e45"
#   name: "limited_brush"
#   brushName: "tree_oak"
#   permission: "schematictools.vip"
#   usages: 50
#   itemSource: "VANILLA"
#   iaId: null
#   material: "STICK"
#   displayName: null
#   lore: null
# currentId: 2
